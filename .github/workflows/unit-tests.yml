name: Unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked test dependencies
        run: |
          dotnet restore tests/Nexus.UnitTests/Nexus.UnitTests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Nexus.Launch.UnitTests/Nexus.Launch.UnitTests.csproj --locked-mode
      - name: Run tests without a game installation
        run: |
          dotnet test tests/Nexus.UnitTests/Nexus.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Nexus.Launch.UnitTests/Nexus.Launch.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=launch-tests.trx" --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
